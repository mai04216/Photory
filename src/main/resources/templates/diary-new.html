<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像を登録 - Photory</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="top-page">
        <div class="top-card">

            <div class="diary-header">
                <a th:href="@{/}" class="auth-back">←</a>
                <span class="auth-header-title">画像を登録する</span>
            </div>

            <div class="date-badge" th:text="${date}">2026-06-17</div>

            <form method="post" th:action="@{/diary/new}" enctype="multipart/form-data">
                <input type="hidden" name="date" th:value="${date}">

                <!-- 画像選択 -->
                <div class="image-upload" id="imageUpload" onclick="document.getElementById('imageInput').click()">
                    <div id="preview" class="image-preview-area">
                        <span class="upload-icon">📷</span>
                        <span class="upload-text">タップして画像を選択</span>
                    </div>
                </div>
                <input type="file" id="imageInput" name="image" accept="image/*"
                       style="display:none" required onchange="previewImage(this)">

                <!-- タイトル -->
                <div class="form-group">
                    <label class="form-label">タイトル</label>
                    <input type="text" name="title" class="form-input"
                           placeholder="今日のベストショット" maxlength="100">
                </div>

                <!-- 日記 -->
                <div class="form-group">
                    <label class="form-label">日記 <span class="char-limit">(150文字以内)</span></label>
                    <textarea name="diaryText" class="form-textarea"
                              placeholder="今日はどんな1日でしたか？"
                              maxlength="150" oninput="updateCount(this)"></textarea>
                    <div class="char-count"><span id="charCount">0</span> / 150</div>
                </div>

                <button type="submit" class="btn btn-primary">✓ 登録する</button>
                <a th:href="@{/}" class="btn btn-cancel">キャンセル</a>
            </form>

        </div>
    </div>

    <script>
    function previewImage(input) {
        if (input.files && input.files[0]) {
            var reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('preview').innerHTML =
                    '<img src="' + e.target.result + '" class="preview-img">';
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    function updateCount(textarea) {
        document.getElementById('charCount').textContent = textarea.value.length;
    }
    </script>
</body>
</html>
