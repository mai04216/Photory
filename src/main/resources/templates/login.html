<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ログイン - Photory</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
	<div class="auth-page">
		<div class="auth-card">
			<div class="auth-logo">
				<span class="auth-logo-icon">📸</span>
				<div class="auth-logo-title">Photory</div>
				<div class="auth-logo-subtitle">毎日の1枚を、カレンダーに。</div>
			</div>

			<!-- エラーメッセージ -->
			<div th:if="${param.error}" class="error-message">
			    <span th:if="${session.SPRING_SECURITY_LAST_EXCEPTION != null and session.SPRING_SECURITY_LAST_EXCEPTION.class.simpleName == 'LockedException'}">
			        アカウントがロックされています。15分後に再度お試しください
			    </span>
			    <span th:unless="${session.SPRING_SECURITY_LAST_EXCEPTION != null and session.SPRING_SECURITY_LAST_EXCEPTION.class.simpleName == 'LockedException'}">
			        メールアドレスまたはパスワードが違います
			    </span>
			</div>

			<form method="post" th:action="@{/login}">
				<div class="form-group">
					<label class="form-label">メールアドレス</label>
					<input type="email" name="username" class="form-input" placeholder="example@mail.com" required>
				</div>
				<div class="form-group">
					<label class="form-label">パスワード</label>
					<input type="password" name="password" class="form-input" placeholder="パスワードを入力" required>
				</div>

				<div class="form-group" style="display:flex;align-items:center;gap:6px">
					<input type="checkbox" name="remember-me" id="remember-me">
					<label for="remember-me" style="font-size:12px;color:#8A8490;margin:0">ログイン状態を保持する</label>
				</div>

				<button type="submit" class="btn btn-primary">ログイン</button>
			</form>

			<div class="divider">
				<span class="divider-line"></span>
				<span class="divider-text">または</span>
				<span class="divider-line"></span>
			</div>

			<a href="/oauth2/authorization/google" class="btn btn-google">
				<span class="btn-google-logo">G</span>
				Googleでログイン
			</a>

			<div class="auth-link">
				アカウントをお持ちでない方は <a th:href="@{/register}">新規登録</a>
			</div>
		</div>
	</div>
</body>

</html>
