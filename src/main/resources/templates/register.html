<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新規登録 - Photory</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
	
	<form method="post" th:action="@{/register}" th:object="${registerForm}">
		<!-- 重複登録エラーメッセージ -->
		<div th:if="${error}" class="error-message" th:text="${error}"></div>

    <div class="form-group">
        <label class="form-label">ユーザー名</label>
        <input type="text" th:field="*{username}" class="form-input"
               placeholder="例: はなこ">
        <div class="field-error" th:if="${#fields.hasErrors('username')}"
             th:errors="*{username}"></div>
    </div>
    <div class="form-group">
        <label class="form-label">メールアドレス</label>
        <input type="email" th:field="*{email}" class="form-input"
               placeholder="example@mail.com">
        <div class="field-error" th:if="${#fields.hasErrors('email')}"
             th:errors="*{email}"></div>
    </div>
    <div class="form-group">
        <label class="form-label">パスワード</label>
        <input type="password" th:field="*{password}" class="form-input"
               placeholder="8文字以上、英字+数字">
        <div class="field-error" th:if="${#fields.hasErrors('password')}"
             th:errors="*{password}"></div>
    </div>
    <button type="submit" class="btn btn-primary">アカウントを作成</button>
</form>
